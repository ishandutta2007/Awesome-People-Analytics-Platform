<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#ec4899;#3b82f6;#6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#06b6d4;#8b5cf6;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#6366f1;#ec4899;#10b981;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: url(#accentGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-opacity: 0.5;
    }
    .metric-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 22px;
      fill: #f8fafc;
    }
    .metric-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #64748b;
    }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Background Grid -->
  <g class="grid">
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="320" x2="1200" y2="320" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="400" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="400" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="400" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="400" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="400" class="grid-line" />
  </g>

  <!-- Decorative Orbit / Circles -->
  <circle cx="1020" cy="200" r="140" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.4" />
  <circle cx="1020" cy="200" r="95" stroke="#475569" stroke-width="1.5" fill="none" opacity="0.5" />
  <circle cx="1020" cy="200" r="50" stroke="#6366f1" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Animated Network Nodes -->
  <g>
    <!-- Connecting lines -->
    <line x1="1020" y1="200" x2="940" y2="130" stroke="#6366f1" stroke-width="2" opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="1020" y1="200" x2="1100" y2="140" stroke="#a855f7" stroke-width="2" opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="1020" y1="200" x2="970" y2="280" stroke="#38bdf8" stroke-width="2" opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="4.5s" repeatCount="indefinite" />
    </line>
    <line x1="1020" y1="200" x2="1090" y2="270" stroke="#ec4899" stroke-width="2" opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.8;0.3;0.8" dur="5s" repeatCount="indefinite" />
    </line>

    <!-- Center Node -->
    <circle cx="1020" cy="200" r="16" fill="#6366f1" filter="url(#glow)">
      <animate attributeName="r" values="14;18;14" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="200" r="8" fill="#ffffff" />

    <!-- Outer Nodes -->
    <circle cx="940" cy="130" r="10" fill="#38bdf8" filter="url(#subtleGlow)">
      <animate attributeName="cy" values="130;124;130" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1100" cy="140" r="11" fill="#a855f7" filter="url(#subtleGlow)">
      <animate attributeName="cy" values="140;146;140" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="970" cy="280" r="9" fill="#10b981" filter="url(#subtleGlow)">
      <animate attributeName="cx" values="970;965;970" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1090" cy="270" r="10" fill="#ec4899" filter="url(#subtleGlow)">
      <animate attributeName="cy" values="270;276;270" dur="4.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(60, 60)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="6" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="22" class="badge-text">⚡ CURATED WORKFORCE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">Awesome People Analytics</text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">SaaS Platforms, Open-Source Repos &amp; Workforce Intelligence</text>

    <!-- Mini Analytics Bar Chart Widget -->
    <g transform="translate(0, 160)">
      <!-- Card Container -->
      <rect width="640" height="100" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      
      <!-- Metrics -->
      <g transform="translate(24, 25)">
        <text x="0" y="22" class="metric-value">20+ SaaS</text>
        <text x="0" y="44" class="metric-label">Pricing &amp; Free Tiers</text>
      </g>
      
      <line x1="165" y1="20" x2="165" y2="80" stroke="#334155" stroke-width="1" />

      <g transform="translate(190, 25)">
        <text x="0" y="22" class="metric-value">30+ OSS</text>
        <text x="0" y="44" class="metric-label">Ranked by Stars ⭐</text>
      </g>

      <line x1="330" y1="20" x2="330" y2="80" stroke="#334155" stroke-width="1" />

      <g transform="translate(355, 25)">
        <text x="0" y="22" class="metric-value">$4.2B</text>
        <text x="0" y="44" class="metric-label">Market Intelligence</text>
      </g>

      <line x1="495" y1="20" x2="495" y2="80" stroke="#334155" stroke-width="1" />

      <g transform="translate(520, 25)">
        <!-- Animated mini chart bars -->
        <rect x="0" y="30" width="12" height="25" rx="3" fill="#6366f1">
          <animate attributeName="height" values="25;40;25" dur="2.5s" repeatCount="indefinite" />
          <animate attributeName="y" values="30;15;30" dur="2.5s" repeatCount="indefinite" />
        </rect>
        <rect x="18" y="20" width="12" height="35" rx="3" fill="#a855f7">
          <animate attributeName="height" values="35;18;35" dur="3s" repeatCount="indefinite" />
          <animate attributeName="y" values="20;37;20" dur="3s" repeatCount="indefinite" />
        </rect>
        <rect x="36" y="10" width="12" height="45" rx="3" fill="#38bdf8">
          <animate attributeName="height" values="45;52;45" dur="2s" repeatCount="indefinite" />
          <animate attributeName="y" values="10;3;10" dur="2s" repeatCount="indefinite" />
        </rect>
        <rect x="54" y="25" width="12" height="30" rx="3" fill="#ec4899">
          <animate attributeName="height" values="30;48;30" dur="3.2s" repeatCount="indefinite" />
          <animate attributeName="y" values="25;7;25" dur="3.2s" repeatCount="indefinite" />
        </rect>
        <rect x="72" y="15" width="12" height="40" rx="3" fill="#10b981">
          <animate attributeName="height" values="40;22;40" dur="2.8s" repeatCount="indefinite" />
          <animate attributeName="y" values="15;33;15" dur="2.8s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>
  </g>
</svg>
